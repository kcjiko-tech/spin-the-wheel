<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1e2b3c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Prize Wheel · Spin & Win</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            background: linear-gradient(145deg, #1e2b3c, #0f1a26);
            overscroll-behavior: none;
            touch-action: manipulation;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        .game-container {
            background: #1e2e3e;
            padding: 1.5rem 1.2rem 1.2rem;
            border-radius: 40px;
            box-shadow: 0 25px 35px rgba(0, 0, 0, 0.7), inset 0 1px 4px rgba(255, 255, 255, 0.1);
            border: 1px solid #3d5568;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        .wheel-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            margin: 0 auto 12px;
            max-width: 420px;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 50%;
            box-shadow: 0 0 0 8px #0f1a26, 0 15px 30px rgba(0, 0, 0, 0.6);
            transition: box-shadow 0.1s;
            touch-action: manipulation;
        }
        .pointer {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 36px solid #f5c542;
            filter: drop-shadow(0 6px 5px rgba(0, 0, 0, 0.5));
            z-index: 10;
            pointer-events: none;
        }
        .pointer::after {
            content: '';
            position: absolute;
            top: -44px;
            left: -11px;
            width: 22px;
            height: 22px;
            background: radial-gradient(circle, #f5e56b, #d4a017);
            border-radius: 50%;
            box-shadow: 0 2px 6px black;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 4px;
        }
        .spin-btn {
            background: radial-gradient(circle at 30% 20%, #f7e05e, #d49b1f);
            border: none;
            font-size: clamp(1.4rem, 6vw, 1.9rem);
            font-weight: 800;
            letter-spacing: 3px;
            color: #1e2b3c;
            padding: clamp(14px, 4vw, 20px) clamp(40px, 14vw, 70px);
            border-radius: 60px;
            box-shadow: 0 8px 0 #7a4f0e, 0 12px 20px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: all 0.06s linear;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            border: 1px solid #ffec9e;
            touch-action: manipulation;
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            max-width: 320px;
        }
        .spin-btn:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #7a4f0e, 0 8px 14px rgba(0, 0, 0, 0.5);
        }
        .spin-btn:disabled {
            opacity: 0.6;
            transform: translateY(4px);
            box-shadow: 0 4px 0 #7a4f0e, 0 8px 12px rgba(0, 0, 0, 0.4);
            cursor: not-allowed;
            pointer-events: none;
        }

        /* ---- Live Stock Counter ---- */
        .stock-counter {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px 8px;
            margin-top: 14px;
            padding: 10px 12px;
            background: #0d1a24cc;
            border-radius: 24px;
            border: 1px solid #2e4b60;
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }
        .stock-chip {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            background: #1a2e3f;
            border-radius: 20px;
            border: 1px solid #3d5b70;
            font-size: clamp(0.65rem, 2.8vw, 0.78rem);
            font-weight: 600;
            color: #cbdae5;
            white-space: nowrap;
        }
        .stock-dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            flex-shrink: 0;
            box-shadow: 0 1px 3px black;
        }
        .stock-count {
            background: #0f1a26;
            padding: 1px 7px;
            border-radius: 12px;
            font-weight: 800;
            color: #f5e56b;
            font-size: 0.85em;
            border: 1px solid #3d5b70;
            min-width: 26px;
            text-align: center;
        }
        .stock-chip.out .stock-count {
            color: #e63946;
            text-decoration: line-through;
            opacity: 0.7;
        }
        .stock-chip.out {
            opacity: 0.6;
        }

        /* ---- Reset Button ---- */
        .reset-row {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
        .reset-btn {
            background: #2e4b60;
            border: 1px solid #4d6f8a;
            color: #fff;
            font-size: clamp(0.7rem, 3vw, 0.85rem);
            font-weight: 700;
            padding: 8px 22px;
            border-radius: 30px;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: 0.15s;
            touch-action: manipulation;
            -webkit-appearance: none;
            appearance: none;
        }
        .reset-btn:active {
            background: #3d5b70;
            transform: scale(0.97);
        }

        /* ---- Popup Modal ---- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            padding: 20px;
        }
        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .modal-box {
            background: linear-gradient(145deg, #1e2e3e, #0f1a26);
            border: 2px solid #f5c542;
            border-radius: 32px;
            padding: clamp(24px, 7vw, 40px) clamp(20px, 7vw, 45px);
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 4px rgba(255, 255, 255, 0.1);
            transform: scale(0.8) translateY(20px);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 100%;
            max-width: 420px;
        }
        .modal-overlay.show .modal-box {
            transform: scale(1) translateY(0);
        }
        .modal-emoji {
            font-size: clamp(3rem, 14vw, 4rem);
            margin-bottom: 8px;
            animation: bounce 0.6s ease infinite alternate;
            line-height: 1;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
        .modal-title {
            font-size: clamp(1.5rem, 6.5vw, 2.2rem);
            font-weight: 800;
            color: #f5e56b;
            text-shadow: 0 2px 10px #00000099;
            margin-bottom: 6px;
            letter-spacing: 2px;
        }
        .modal-subtitle {
            font-size: clamp(0.7rem, 3vw, 1rem);
            color: #aac2d4;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 14px;
        }
        .modal-prize {
            font-size: clamp(1.4rem, 6vw, 2.2rem);
            font-weight: 800;
            color: #ffffff;
            background: linear-gradient(135deg, #2a9d8f, #e63946);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
            margin-bottom: 24px;
            padding: 6px 0;
            line-height: 1.3;
        }
        .modal-close {
            background: radial-gradient(circle at 30% 20%, #f7e05e, #d49b1f);
            border: none;
            font-size: clamp(0.95rem, 4vw, 1.1rem);
            font-weight: 800;
            letter-spacing: 2px;
            color: #1e2b3c;
            padding: clamp(12px, 3.5vw, 14px) clamp(36px, 12vw, 50px);
            border-radius: 60px;
            box-shadow: 0 6px 0 #7a4f0e, 0 8px 16px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: all 0.06s linear;
            text-transform: uppercase;
            border: 1px solid #ffec9e;
            touch-action: manipulation;
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            max-width: 260px;
        }
        .modal-close:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #7a4f0e, 0 4px 8px rgba(0, 0, 0, 0.5);
        }

        /* Landscape adjustment for small screens */
        @media (max-height: 600px) and (orientation: landscape) {
            .game-container {
                display: flex;
                align-items: center;
                gap: 20px;
                padding: 1rem;
                max-width: 90vw;
            }
            .wheel-wrapper {
                width: 55vw;
                max-width: 280px;
                margin: 0;
            }
            .controls {
                flex-direction: column;
                gap: 12px;
                margin-top: 0;
            }
            .spin-btn {
                max-width: 200px;
            }
            .stock-counter {
                max-width: 40vw;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="wheel-wrapper">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="600" height="600"></canvas>
        </div>
        <div class="controls">
            <button class="spin-btn" id="spinButton">SPIN</button>
        </div>

        <!-- Live Stock Counter -->
        <div class="stock-counter" id="stockCounter" hidden="hidden" style="display:none"></div>

        <!-- Reset Button -->
        <div class="reset-row">
            <button class="reset-btn" id="resetBtn" hidden="hidden" style="display:none">↻ Reset Stock</button>
        </div>
    </div>

    <!-- Popup Modal -->
    <div class="modal-overlay" id="congratsModal">
        <div class="modal-box">
            <div class="modal-emoji">🎉</div>
            <div class="modal-title">CONGRATULATIONS!</div>
            <div class="modal-subtitle">You won</div>
            <div class="modal-prize" id="modalPrizeText">—</div>
            <button class="modal-close" id="modalCloseBtn">AWESOME!</button>
        </div>
    </div>

    <script>
        (function() {
            // ---- PRIZE CONFIGURATION ----
            // 9 slices total:
            //   3 × 10%
            //   2 × 20%
            //   1 × 30%
            //   1 × Towel
            //   1 × Ratrepellant
            //   1 × Free wash
            // Each slice has its own independent stock.
            const PRIZES = [
                { id: '10a',   label: '10%',           popupName: '10% on Restaurant Bill',  probability: 10, color: '#e63946', initialStock: 100, stock: 100 },
                { id: '20a',   label: '20%',           popupName: '20% on Restaurant Bill',  probability: 20, color: '#f4a261', initialStock: 50,  stock: 50  },
                { id: '30',    label: '30%',           popupName: '30% on Restaurant Bill',  probability: 30, color: '#2a9d8f', initialStock: 40,  stock: 40  },
                { id: 'towel', label: 'Towel',         popupName: 'Free Towel',              probability: 12, color: '#9c89b8', initialStock: 12,  stock: 12  },
                { id: '10b',   label: '10%',           popupName: '10% on Restaurant Bill',  probability: 10, color: '#d62839', initialStock: 100, stock: 100 },
                { id: 'rat',   label: 'Ratrepellant',  popupName: 'Free Ratrepellant',       probability: 6,  color: '#b5838d', initialStock: 6,   stock: 6   },
                { id: '20b',   label: '20%',           popupName: '20% on Restaurant Bill',  probability: 20, color: '#e76f51', initialStock: 50,  stock: 50  },
                { id: 'wash',  label: 'Free wash',     popupName: 'Free Wash',               probability: 6,  color: '#6d597a', initialStock: 6,   stock: 6   },
                { id: '10c',   label: '10%',           popupName: '10% on Restaurant Bill',  probability: 10, color: '#c1121f', initialStock: 100, stock: 100 }
            ];

            const STORAGE_KEY = 'prizeWheelStock_v3';

            // ---- State ----
            let currentRotation = 0;
            let spinning = false;
            let animationFrame = null;

            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const spinBtn = document.getElementById('spinButton');
            const modalOverlay = document.getElementById('congratsModal');
            const modalPrizeText = document.getElementById('modalPrizeText');
            const modalCloseBtn = document.getElementById('modalCloseBtn');
            const stockCounter = document.getElementById('stockCounter');
            const resetBtn = document.getElementById('resetBtn');

            const centerX = 300;
            const centerY = 300;
            const radius = 280;

            // ---- LocalStorage: Save / Load ----
            function saveStock() {
                try {
                    const data = {};
                    PRIZES.forEach(p => { data[p.id] = p.stock; });
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                } catch (e) {
                    console.warn('Could not save stock:', e);
                }
            }

            function loadStock() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return;
                    const data = JSON.parse(raw);
                    PRIZES.forEach(p => {
                        if (typeof data[p.id] === 'number') {
                            p.stock = Math.max(0, data[p.id]);
                        }
                    });
                } catch (e) {
                    console.warn('Could not load stock:', e);
                }
            }

            function resetStock() {
                PRIZES.forEach(p => { p.stock = p.initialStock; });
                try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
                updateStockCounter();
                drawWheel(currentRotation);
                spinBtn.disabled = false;
                if (navigator.vibrate) navigator.vibrate(30);
            }

            // ---- Helper: get in-stock prizes ----
            function getInStockPrizes() {
                return PRIZES.filter(p => p.stock > 0);
            }

            // ---- Update the live stock counter UI ----
            function updateStockCounter() {
                stockCounter.innerHTML = '';
                PRIZES.forEach(p => {
                    const chip = document.createElement('div');
                    chip.className = 'stock-chip' + (p.stock <= 0 ? ' out' : '');

                    const dot = document.createElement('span');
                    dot.className = 'stock-dot';
                    dot.style.background = p.color;

                    const label = document.createElement('span');
                    label.textContent = p.label;

                    const count = document.createElement('span');
                    count.className = 'stock-count';
                    count.textContent = p.stock;

                    chip.appendChild(dot);
                    chip.appendChild(label);
                    chip.appendChild(count);
                    stockCounter.appendChild(chip);
                });
            }

            // ---- Draw wheel (all slices always visible) ----
            function drawWheel(rotationOffset = 0) {
                const allPrizes = PRIZES;
                const numSlices = allPrizes.length;

                ctx.clearRect(0, 0, 600, 600);

                // Outer ring
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius + 8, 0, 2 * Math.PI);
                ctx.fillStyle = '#1a2a36';
                ctx.fill();
                ctx.shadowColor = '#000000aa';
                ctx.shadowBlur = 18;
                ctx.shadowOffsetY = 6;

                const anglePerSlice = (Math.PI * 2) / numSlices;

                // Draw slices
                allPrizes.forEach((prize, idx) => {
                    const start = idx * anglePerSlice + rotationOffset;
                    const end = start + anglePerSlice;
                    const isOutOfStock = prize.stock <= 0;

                    // Wedge
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius, start, end);
                    ctx.closePath();

                    if (isOutOfStock) {
                        ctx.fillStyle = '#3a4a5a';
                    } else {
                        ctx.fillStyle = prize.color;
                    }
                    ctx.fill();

                    // Slice border
                    ctx.strokeStyle = '#0d1a24';
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    // Draw the label text
                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.rotate(start + anglePerSlice / 2);
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    let label = prize.label;
                    let fontSize = 22;
                    if (label.length > 6) fontSize = 17;
                    if (label.length > 10) fontSize = 14;
                    if (label.length > 14) fontSize = 12;

                    ctx.font = `bold ${fontSize}px 'Segoe UI', system-ui, sans-serif`;

                    if (isOutOfStock) {
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                        ctx.shadowColor = 'transparent';
                    } else {
                        ctx.fillStyle = '#ffffff';
                        ctx.shadowColor = '#000000dd';
                        ctx.shadowBlur = 8;
                        ctx.shadowOffsetX = 2;
                        ctx.shadowOffsetY = 2;
                    }

                    const textRadius = radius * 0.68;
                    let angleDeg = ((start + anglePerSlice / 2) * 180 / Math.PI) % 360;
                    if (angleDeg < 0) angleDeg += 360;

                    if (angleDeg > 90 && angleDeg < 270) {
                        ctx.rotate(Math.PI);
                        ctx.fillText(label, -textRadius, 0);
                    } else {
                        ctx.fillText(label, textRadius, 0);
                    }
                    ctx.restore();
                });

                // Center circle
                ctx.beginPath();
                ctx.arc(centerX, centerY, 48, 0, 2 * Math.PI);
                ctx.fillStyle = '#0f1a26';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#000000';
                ctx.fill();
                ctx.strokeStyle = '#f5c542';
                ctx.lineWidth = 6;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // ---- Get winnable prize (skips out-of-stock slices) ----
            function getWinnablePrizeAtPointer(rotation) {
                const allPrizes = PRIZES;
                const numSlices = allPrizes.length;
                const anglePerSlice = (Math.PI * 2) / numSlices;

                const pointerAngle = -Math.PI / 2;
                let normPointer = pointerAngle % (2 * Math.PI);
                if (normPointer < 0) normPointer += 2 * Math.PI;

                let landedIndex = -1;
                for (let i = 0; i < numSlices; i++) {
                    const start = i * anglePerSlice + rotation;
                    const end = start + anglePerSlice;

                    let normStart = start % (2 * Math.PI);
                    if (normStart < 0) normStart += 2 * Math.PI;
                    let normEnd = end % (2 * Math.PI);
                    if (normEnd < 0) normEnd += 2 * Math.PI;

                    let isInside = false;
                    if (normStart < normEnd) {
                        isInside = (normPointer >= normStart && normPointer < normEnd);
                    } else {
                        isInside = (normPointer >= normStart || normPointer < normEnd);
                    }

                    if (isInside) {
                        landedIndex = i;
                        break;
                    }
                }

                if (landedIndex === -1) return null;

                // Walk clockwise to find first in-stock prize
                for (let step = 0; step < numSlices; step++) {
                    const idx = (landedIndex + step) % numSlices;
                    if (allPrizes[idx].stock > 0) {
                        return allPrizes[idx];
                    }
                }

                return null;
            }

            // ---- Show popup ----
            function showCongrats(prizeName) {
                modalPrizeText.textContent = prizeName;
                modalOverlay.classList.add('show');
                if (navigator.vibrate) navigator.vibrate(50);
            }

            function hideCongrats() {
                modalOverlay.classList.remove('show');
            }

            // ---- Spin logic ----
            function startSpin() {
                if (spinning) return;

                const inStock = getInStockPrizes();
                if (inStock.length === 0) {
                    showCongrats('SOLD OUT');
                    return;
                }

                spinning = true;
                spinBtn.disabled = true;

                if (navigator.vibrate) navigator.vibrate(30);

                const fullRotations = 5 + Math.floor(Math.random() * 4);
                const extraAngle = Math.random() * Math.PI * 2;
                const spinAngle = fullRotations * Math.PI * 2 + extraAngle;

                const startRot = currentRotation % (Math.PI * 2);
                const targetRot = startRot + spinAngle;
                const duration = 3800 + Math.random() * 1200;
                const startTime = performance.now();

                function animateSpin(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const eased = 1 - Math.pow(1 - progress, 3);

                    currentRotation = startRot + (targetRot - startRot) * eased;
                    drawWheel(currentRotation);

                    if (progress < 1) {
                        animationFrame = requestAnimationFrame(animateSpin);
                    } else {
                        spinning = false;
                        spinBtn.disabled = false;

                        const prize = getWinnablePrizeAtPointer(currentRotation);
                        if (prize) {
                            if (prize.stock > 0) {
                                prize.stock -= 1;
                                saveStock();
                                updateStockCounter();
                            }

                            drawWheel(currentRotation);
                            showCongrats(prize.popupName);

                            if (getInStockPrizes().length === 0) {
                                spinBtn.disabled = true;
                            }
                        } else {
                            showCongrats('SOLD OUT');
                            spinBtn.disabled = true;
                        }

                        currentRotation = currentRotation % (Math.PI * 2);
                        drawWheel(currentRotation);
                    }
                }

                animationFrame = requestAnimationFrame(animateSpin);
            }

            // ---- Initialize ----
            function init() {
                loadStock();
                updateStockCounter();
                drawWheel(0);

                let touchHandled = false;

                spinBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    touchHandled = true;
                    if (!spinning && !modalOverlay.classList.contains('show') && getInStockPrizes().length > 0) {
                        startSpin();
                    }
                    setTimeout(() => { touchHandled = false; }, 300);
                }, { passive: false });

                spinBtn.addEventListener('click', () => {
                    if (touchHandled) return;
                    if (!spinning && !modalOverlay.classList.contains('show') && getInStockPrizes().length > 0) {
                        startSpin();
                    }
                });

                modalCloseBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    hideCongrats();
                }, { passive: false });

                modalCloseBtn.addEventListener('click', () => {
                    hideCongrats();
                });

                modalOverlay.addEventListener('click', (e) => {
                    if (e.target === modalOverlay) hideCongrats();
                });

                resetBtn.addEventListener('click', () => {
                    if (spinning) return;
                    resetStock();
                });

                window.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && modalOverlay.classList.contains('show')) {
                        hideCongrats();
                    }
                    if (e.code === 'Space' && !spinning && !modalOverlay.classList.contains('show') && getInStockPrizes().length > 0) {
                        e.preventDefault();
                        startSpin();
                    }
                });

                canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (!spinning && !modalOverlay.classList.contains('show') && getInStockPrizes().length > 0) {
                        startSpin();
                    }
                }, { passive: false });

                canvas.addEventListener('click', () => {
                    if (!spinning && !modalOverlay.classList.contains('show') && getInStockPrizes().length > 0) startSpin();
                });

                document.addEventListener('contextmenu', (e) => e.preventDefault());
                document.addEventListener('gesturestart', (e) => e.preventDefault());

                let lastTouchEnd = 0;
                document.addEventListener('touchend', (e) => {
                    const now = Date.now();
                    if (now - lastTouchEnd <= 300) {
                        e.preventDefault();
                    }
                    lastTouchEnd = now;
                }, { passive: false });
            }

            init();

            window.addEventListener('beforeunload', () => {
                if (animationFrame) cancelAnimationFrame(animationFrame);
            });
        })();
    </script>
</body>
</html>
